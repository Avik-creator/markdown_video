name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      # Gate on critical advisories in production dependencies. Dev-only
      # advisories are still visible in `pnpm audit` output locally.
      - run: pnpm audit --prod --audit-level=critical
        timeout-minutes: 5
      - run: pnpm lint
        timeout-minutes: 5
      - run: pnpm typecheck
        timeout-minutes: 5
      - run: pnpm test
        timeout-minutes: 10
      - run: pnpm build
        timeout-minutes: 15
      # Browser-dependent golden/ffprobe tests are deliberately separate from
      # unit tests. Cache the Playwright browser download but still perform the
      # version-aware install step so a lockfile/browser revision change is picked up.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm --filter markdown-video exec playwright-core install chromium
        timeout-minutes: 10
      - name: Ensure native ffmpeg/ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
        timeout-minutes: 10
      - run: pnpm --filter markdown-video test:integration
        timeout-minutes: 10
      - run: pnpm --filter @markdown-video/render-worker test:integration
        timeout-minutes: 10
